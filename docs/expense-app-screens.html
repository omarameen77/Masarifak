<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصاريفك</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --bg:#F7F6F2; --surface:#FFFFFF; --sunk:#EFEDE7; --ink:#252923; --ink2:#4A4E47; --muted:#6E716A; --line:#E6E4DD; --line2:#D6D3CA;
  --acc:#426B56; --acc-ink:#FFFFFF; --acc-soft:#E6EEE9; --acc-text:#355846;
  --warn:#8A5A0B; --warn-soft:#F7ECD8; --warn-line:#E9D3A8;
  --crit:#A23E33; --crit-soft:#F7E3DF; --crit-line:#EBC4BD;
  --lux:#8A5A0B;
  --r-s:8px; --r:12px; --r-l:16px;
  --tap:44px;
  --font:"IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  color-scheme: light;
  box-sizing:border-box; padding-top:var(--sat); padding-bottom:var(--sab);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161916; --surface:#1F231F; --sunk:#262B26; --ink:#ECEDE8; --ink2:#C9CBC4; --muted:#A0A39B; --line:#2E332E; --line2:#3A403A;
  --acc:#7DAA90; --acc-ink:#102016; --acc-soft:#22322A; --acc-text:#9CC4AD;
  --warn:#E2B566; --warn-soft:#352B19; --warn-line:#56442A; --crit:#EE9A8E; --crit-soft:#3A2321; --crit-line:#5A3530; --lux:#E2B566;
  color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#161916; --surface:#1F231F; --sunk:#262B26; --ink:#ECEDE8; --ink2:#C9CBC4; --muted:#A0A39B; --line:#2E332E; --line2:#3A403A;
  --acc:#7DAA90; --acc-ink:#102016; --acc-soft:#22322A; --acc-text:#9CC4AD;
  --warn:#E2B566; --warn-soft:#352B19; --warn-line:#56442A; --crit:#EE9A8E; --crit-soft:#3A2321; --crit-line:#5A3530; --lux:#E2B566;
  color-scheme: dark; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:var(--sat)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sat);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.ic{width:22px;height:22px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
bdi.money{white-space:nowrap;font-variant-numeric:tabular-nums}
.cur{font-size:.78em;color:var(--muted);font-weight:400}
.num{font-variant-numeric:tabular-nums}

/* ---- shell ---- */
#app{height:100%;max-width:440px;margin:0 auto;position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
@media (min-width:600px){#app{border-inline:1px solid var(--line)}}
.scr{flex:1;display:flex;flex-direction:column;min-height:0}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 24px;overscroll-behavior:contain}
.body.has-tabs{padding-bottom:96px}
.top{display:flex;align-items:center;gap:4px;min-height:56px;padding:6px 8px;background:var(--bg);position:relative;z-index:5}
.top h1{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .pad{width:8px}
.top.big{padding:12px 16px 6px}
.top.big h1{font-size:22px}
.ibtn{width:var(--tap);height:var(--tap);display:grid;place-items:center;border-radius:10px;color:var(--ink2);flex:none;position:relative}
.ibtn:hover{background:var(--sunk)}
.ibtn .dot{position:absolute;top:10px;inset-inline-start:10px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.foot{padding:12px 16px calc(12px + var(--sab));border-top:1px solid var(--line);background:var(--bg)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--acc-soft);color:var(--acc-text);display:grid;place-items:center;font-weight:600;font-size:15px}

/* ---- tab bar ---- */
.tabbar{position:absolute;bottom:0;inset-inline:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + var(--sab));z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;font-size:12px;color:var(--muted);border-radius:10px}
.tab[aria-current="page"]{color:var(--acc-text);font-weight:600}
.tab[aria-current="page"] .ic{stroke-width:2.1}
.fab{position:absolute;inset-inline-end:16px;bottom:calc(76px + var(--sab));height:52px;padding:0 18px 0 20px;border-radius:26px;background:var(--acc);color:var(--acc-ink);display:flex;align-items:center;gap:6px;font-weight:600;z-index:21;box-shadow:0 2px 0 rgba(37,41,35,.08),0 6px 16px -6px rgba(37,41,35,.35)}

/* ---- type ---- */
.h2{font-size:15px;font-weight:600;margin:24px 2px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.h2 .link{font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.link{color:var(--acc-text);font-weight:600;font-size:14px;min-height:var(--tap);display:inline-flex;align-items:center;padding:0 4px}
.lead{font-size:14px;color:var(--muted);margin:0 2px 16px}
p{margin:0 0 8px}

/* ---- surfaces ---- */
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.group+.group{margin-top:12px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;width:100%;text-align:start;position:relative}
.row+.row::before{content:"";position:absolute;top:0;inset-inline:14px 14px;border-top:1px solid var(--line)}
.row.has-ic+.row.has-ic::before{inset-inline-start:58px}
button.row:hover,a.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted)}
.row .end{text-align:end;flex:none}
.row .val{font-weight:600;font-variant-numeric:tabular-nums}
.row .chev{color:var(--muted);width:18px;height:18px}
.ricon{width:34px;height:34px;border-radius:9px;background:var(--sunk);color:var(--ink2);display:grid;place-items:center;flex:none}
.ricon .ic{width:19px;height:19px}
.ricon.acc{background:var(--acc-soft);color:var(--acc-text)}
.ricon.warn{background:var(--warn-soft);color:var(--warn)}
.ricon.crit{background:var(--crit-soft);color:var(--crit)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);font-size:14px;background:var(--sunk);color:var(--ink2)}
.note .ic{width:19px;height:19px;margin-top:2px}
.note.warn{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn-line)}
.note.warn .ic{color:var(--warn)}
.note.crit{background:var(--crit-soft);color:var(--ink);border:1px solid var(--crit-line)}
.note.crit .ic{color:var(--crit)}
.note.ok{background:var(--acc-soft);color:var(--ink)}
.note.ok .ic{color:var(--acc-text)}
.note b{font-weight:600}
.banner{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:0 16px 8px;border-radius:10px;background:var(--sunk);font-size:13px}
.banner .main{flex:1}

/* ---- status tags: icon + word, never color alone ---- */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 8px 2px 8px;border-radius:999px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.tag .ic{width:13px;height:13px;stroke-width:2.2}
.tag.ok{background:var(--acc-soft);color:var(--acc-text)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.crit{background:var(--crit-soft);color:var(--crit)}
.lux-mark{color:var(--lux)}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:10px;font-weight:600;font-size:15px;border:1px solid transparent;width:100%}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sec{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.btn.ghost{color:var(--acc-text)}
.btn.danger{background:var(--crit);color:#fff}
:root[data-theme="dark"] .btn.danger{color:#1b0f0d}
.btn.danger-ghost{color:var(--crit);border-color:var(--crit-line);background:var(--surface)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;width:auto}
.btns{display:flex;gap:10px}
.btns>.btn{flex:1}
.btns>.input{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}

/* ---- forms ---- */
.field{margin-bottom:16px}
.field>label,.flabel{display:block;font-size:13.5px;font-weight:500;color:var(--ink2);margin:0 2px 6px}
.input{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line2);border-radius:10px;min-height:50px;padding:0 14px;gap:8px}
.input:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.input input,.input select,.input textarea{flex:1;min-width:0;border:0;background:none;outline:none;min-height:48px;font-size:16px}
.input textarea{min-height:80px;padding:12px 0;resize:vertical}
.input .unit{color:var(--muted);font-size:14px}
.input.big input{font-size:28px;font-weight:600;min-height:64px;font-variant-numeric:tabular-nums}
.input.err{border-color:var(--crit)}
.input input[dir="ltr"]{text-align:right}
.input input[dir="ltr"]::placeholder{text-align:right}
.ferr{color:var(--crit);font-size:13px;margin:6px 2px 0;display:flex;gap:6px;align-items:center}
.ferr .ic{width:15px;height:15px}
.fhint{color:var(--muted);font-size:13px;margin:6px 2px 0}
.strength{display:flex;gap:4px;margin-top:8px}
.strength i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.strength[data-l="1"] i:nth-child(-n+1){background:var(--crit)}
.strength[data-l="2"] i:nth-child(-n+2){background:var(--warn)}
.strength[data-l="3"] i:nth-child(-n+3){background:var(--acc)}
.strength[data-l="4"] i{background:var(--acc)}

/* ---- chips & segments ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-text);font-weight:600}
.chip .ic{width:16px;height:16px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;min-height:40px;border-radius:8px;font-size:14px;color:var(--ink2);padding:0 6px}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.choice{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);text-align:start;min-height:60px}
.choice+.choice{margin-top:8px}
.choice[aria-checked="true"]{border-color:var(--acc);background:var(--acc-soft)}
.choice .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.choice[aria-checked="true"] .radio{border-color:var(--acc)}
.choice[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc)}
.switch{width:46px;height:28px;border-radius:14px;background:var(--line2);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:inset-inline-start .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
[aria-checked="true"]>.switch,.switch[aria-checked="true"]{background:var(--acc)}
[aria-checked="true"]>.switch::after,.switch[aria-checked="true"]::after{inset-inline-start:21px}

/* ---- home ---- */
.hero{padding:6px 2px 4px}
.hero .lbl{font-size:14px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.hero .amt{font-size:44px;font-weight:600;line-height:1.15;letter-spacing:-.5px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.hero .amt .cur{font-size:18px;font-weight:500;color:var(--muted)}
.hero .sub{font-size:14px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .v .cur{font-size:13px}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}

/* the cycle ruler: one tick per day from payday to payday */
.ruler{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px}
.ruler .ticks{display:flex;gap:2px;height:30px;align-items:flex-end;direction:rtl}
.ruler .ticks i{flex:1;height:14px;border-radius:2px;background:var(--line)}
.ruler .ticks i.past{background:var(--acc);opacity:.55}
.ruler .ticks i.today{height:30px;background:var(--acc);opacity:1}
.ruler .ticks i.floor{background:var(--warn);height:22px}
.ruler .ticks i.past.over{background:var(--warn);opacity:.7}
.ruler .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.ruler .legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);margin-top:10px}
.ruler .legend span{display:inline-flex;align-items:center;gap:6px}
.ruler .legend b{width:10px;height:10px;border-radius:2px;display:inline-block}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.meter{margin-top:6px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.qa .btn{min-height:52px}
.quick{display:flex;gap:8px;margin-top:16px}
.quick .input{flex:1;min-height:48px}

/* ---- lists ---- */
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:18px 4px 6px;font-weight:500}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .ricon{margin:0 auto 12px;width:52px;height:52px;border-radius:14px}
.empty .ricon .ic{width:26px;height:26px}
.empty h3{color:var(--ink);font-size:16px;margin:0 0 4px;font-weight:600}
.empty p{font-size:14px;max-width:280px;margin:0 auto 16px}
.sum-line{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;font-variant-numeric:tabular-nums}
.sum-line+.sum-line{border-top:1px solid var(--line)}
.sum-line.total{font-weight:600;background:var(--sunk)}
.sum-line .op{color:var(--muted);margin-inline-end:6px}

/* ---- detail ---- */
.dhero{text-align:center;padding:12px 0 20px}
.dhero .amt{font-size:36px;font-weight:600;font-variant-numeric:tabular-nums}
.dhero .who{font-size:16px;color:var(--ink2)}
.receipt-thumb{width:100%;max-height:260px;object-fit:contain;border-radius:var(--r);border:1px solid var(--line);background:var(--sunk)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;min-height:48px;align-items:center}
.kv+.kv{border-top:1px solid var(--line)}
.kv .k{color:var(--muted);font-size:14px}
.kv .v{font-weight:500;text-align:end}

/* ---- sheets, dialogs, toast ---- */
.scrim{position:absolute;inset:0;background:rgba(20,22,19,.42);z-index:40;display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;max-height:92%;border-radius:var(--r-l) var(--r-l) 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0}
.sheet .shead{display:flex;align-items:center;gap:4px;padding:4px 8px 0 8px;min-height:52px}
.sheet .shead h2{flex:1;font-size:17px;margin:0;font-weight:600;padding:0 8px}
.sheet .sbody{overflow-y:auto;padding:4px 16px 16px}
.sheet .sfoot{padding:12px 16px calc(12px + var(--sab));border-top:1px solid var(--line)}
.dialog{background:var(--surface);margin:auto 16px;border-radius:var(--r-l);padding:20px;width:100%;animation:fade .15s}
.scrim.center{align-items:center}
.dialog h2{font-size:17px;margin:0 0 6px}
.dialog p{color:var(--ink2);font-size:14.5px;margin-bottom:18px}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@keyframes fade{from{opacity:0;transform:scale(.98)}}
.toast{position:absolute;inset-inline:16px;bottom:calc(84px + var(--sab));background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:30;font-size:14px;animation:fade .15s}
.toast.notabs{bottom:calc(24px + var(--sab))}
.toast .main{flex:1}
.toast button{color:var(--bg);font-weight:600;text-decoration:underline;min-height:36px;padding:0 6px}
.skel{background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}

/* ---- onboarding / auth ---- */
.steps{display:flex;gap:6px;padding:0 16px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--acc)}
.stepno{font-size:13px;color:var(--muted);margin:14px 2px 2px}
.title{font-size:24px;font-weight:600;margin:4px 2px 6px;line-height:1.3}
.brand{display:flex;align-items:center;gap:10px;margin:28px 2px 28px;font-weight:600;font-size:18px;color:var(--acc-text)}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center}
.cycle-demo{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);background:var(--sunk);border-radius:10px;padding:10px 12px;margin-top:8px}

/* ---- chat ---- */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.msg{max-width:86%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.6}
.msg.me{align-self:flex-start;background:var(--acc);color:var(--acc-ink);border-end-start-radius:4px}
.msg.bot{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-end-end-radius:4px}
.msg .src{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:6px}
.msg .src .ic{width:13px;height:13px}
.msg .lines{margin:6px 0 0;padding:0;list-style:none}
.msg .lines li{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-top:1px dashed var(--line)}
.msg .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.composer{padding:8px 12px calc(76px + var(--sab));background:var(--bg);border-top:1px solid var(--line)}
.composer form{display:flex;gap:8px}
.composer .input{flex:1;min-height:46px}
.composer .send{width:46px;height:46px;border-radius:10px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:none}

/* ---- report ---- */
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:10px 0}
.split i{display:block}
.legend-rows .r{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.legend-rows .r b{width:10px;height:10px;border-radius:3px;flex:none}
.legend-rows .r span:nth-child(2){flex:1}
.cat-row{padding:10px 14px}

<script>
/* ===== util: formatting, dates, parsing, icons ===== */
const NF = new Intl.NumberFormat('ar-EG', { maximumFractionDigits: 2 });
const NF0 = new Intl.NumberFormat('ar-EG', { maximumFractionDigits: 0 });
const U = {
  n(v) { return NF.format(Math.round((+v || 0) * 100) / 100); },
  n0(v) { return NF0.format(Math.round(+v || 0)); },
  // money: number + currency, wrapped so mixed direction never breaks
  m(v, cls = '') {
    const neg = v < 0;
    return `<bdi class="money ${cls}">${neg ? '−' : ''}${U.n(Math.abs(v))}<span class="cur"> ج.م</span></bdi>`;
  },
  m0(v, cls = '') {
    const neg = v < 0;
    return `<bdi class="money ${cls}">${neg ? '−' : ''}${U.n0(Math.abs(v))}<span class="cur"> ج.م</span></bdi>`;
  },
  pct(v) { return NF0.format(Math.round(v)) + '٪'; },
  // accept Arabic-Indic / Persian digits, Arabic decimal and thousands separators
  num(s) {
    if (s == null) return NaN;
    s = String(s).trim()
      .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632)
      .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776)
      .replace(/[٬,\s]/g, '').replace(/[٫]/g, '.');
    if (!/^\d*\.?\d+$|^\d+\.$/.test(s)) return NaN;
    return parseFloat(s);
  },
  esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  id() { return Math.random().toString(36).slice(2, 10); },
  // dates as local 'YYYY-MM-DD' strings
  iso(d) { const z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; },
  parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); },
  today() { return U.iso(new Date()); },
  addDays(s, k) { const d = U.parse(s); d.setDate(d.getDate() + k); return U.iso(d); },
  diffDays(a, b) { return Math.round((U.parse(b) - U.parse(a)) / 864e5); },
  dim(y, m) { return new Date(y, m + 1, 0).getDate(); },
  dayMonth(s) { return new Intl.DateTimeFormat('ar-EG', { day: 'numeric', month: 'long' }).format(U.parse(s)); },
  monthName(s) { return new Intl.DateTimeFormat('ar-EG', { month: 'long' }).format(U.parse(s)); },
  monthYear(s) { return new Intl.DateTimeFormat('ar-EG', { month: 'long', year: 'numeric' }).format(U.parse(s)); },
  weekday(s) { return new Intl.DateTimeFormat('ar-EG', { weekday: 'long' }).format(U.parse(s)); },
  relDay(s) {
    const d = U.diffDays(s, U.today());
    if (d === 0) return 'النهاردة';
    if (d === 1) return 'إمبارح';
    return U.weekday(s) + ' ' + U.dayMonth(s);
  },
  dayWord(n) {
    n = Math.round(n);
    if (n === 1) return 'يوم واحد';
    if (n === 2) return 'يومين';
    if (n >= 3 && n <= 10) return U.n0(n) + ' أيام';
    return U.n0(n) + ' يوم';
  },
  norm(s) { return String(s || '').toLowerCase().replace(/[\u064B-\u0652\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').trim(); },
};

  image: '<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m20.5 16-5-5-8 8.5"/>',
  pen: '<path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/>',

  download: '<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>',
  logout: '<path d="M10 4.5H6A1.5 1.5 0 0 0 4.5 6v12A1.5 1.5 0 0 0 6 19.5h4M15 8l-4 4 4 4M11 12h9"/>',
  eye: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff: '<path d="M4 4l16 16M10 6a9 9 0 0 1 2-.5c6 0 9.5 6.5 9.5 6.5a16 16 0 0 1-3 3.7M6.6 7.6C4 9.4 2.5 12 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.2-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',

  info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>',

  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  receipt: '<path d="M6 3.5h12v17l-2-1.3-2 1.3-2-1.3-2 1.3-2-1.3-2 1.3z"/><path d="M9 8h6M9 11.5h6M9 15h3"/>',
  skip: '<path d="M6 6l8 6-8 6zM17 6v12"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="1.5"/>',
  chart: '<path d="M4 20h16M7 16v-5M12 16V7M17 16v-8"/>',
  shield: '<path d="M12 3.5 5 6v5.5c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/>',
  piggy: '<path d="M5 11a6 5 0 0 1 11.5-2H19v3l1.5 1-1.5 2v2h-2.5L15 19h-2v-1.5H9V19H7l-.8-2.5A5 5 0 0 1 5 11z"/><path d="M15 11h.01"/>',
  repeat: '<path d="M4 10a6 6 0 0 1 10.5-4H17M17 3v3h-3M20 14a6 6 0 0 1-10.5 4H7M7 21v-3h3"/>',

  bolt: '<path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/>',

function ic(name, cls = '') {
  return `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ''}</svg>`;
}

/* ===== calc: pure business calculations (no DOM) ===== */
const Calc = {
  keyOf(y, m) { const d = new Date(y, m, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; },
  shiftKey(key, n) { const [y, m] = key.split('-').map(Number); return Calc.keyOf(y, m - 1 + n); },
  cmpKey(a, b) { return a < b ? -1 : a > b ? 1 : 0; },
  keyDiff(a, b) { const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); },

  /* A cycle runs from payday to the day before the next payday (not the calendar month).
     Paydays past the end of a short month fall on its last day. */
  cycleByKey(key, payday) {
    const [y, m] = key.split('-').map(Number);
    const start = new Date(y, m - 1, Math.min(payday, U.dim(y, m - 1)));
    const ny = m === 12 ? y + 1 : y, nm = m === 12 ? 0 : m;
    const next = new Date(ny, nm, Math.min(payday, U.dim(ny, nm)));
    const s = U.iso(start), nx = U.iso(next), e = U.addDays(nx, -1);
    return { key, start: s, end: e, next: nx, days: U.diffDays(s, nx) };
  },
  cycleOf(iso, payday) {
    const d = U.parse(iso), y = d.getFullYear(), m = d.getMonth();
    const sd = Math.min(payday, U.dim(y, m));
    const key = d.getDate() >= sd ? Calc.keyOf(y, m) : Calc.keyOf(y, m - 1);
    return Calc.cycleByKey(key, payday);
  },
  current() { return Calc.cycleOf(U.today(), Store.d.settings.payday); },
  label(c) {
    if (U.parse(c.start).getDate() === 1) return U.monthYear(c.start);
    return `${U.dayMonth(c.start)} – ${U.dayMonth(c.end)}`;
  },
  shortLabel(c) { return U.parse(c.start).getDate() === 1 ? U.monthName(c.start) : `دورة ${U.dayMonth(c.start)}`; },

  /* ---- obligations ---- */
  active(o, key) { return Calc.cmpKey(o.startKey || '0000-00', key) <= 0 && (!o.stopKey || Calc.cmpKey(key, o.stopKey) < 0); },
  dueKey(o, key) { // next due cycle for periodic obligations, at or after `key`
    let k = o.dueKey; const n = o.everyMonths || 12;
    while (Calc.cmpKey(k, key) < 0) k = Calc.shiftKey(k, n);
    return k;
  },
  isDueCycle(o, key) { return o.kind !== 'periodic' || Calc.dueKey(o, key) === key; },
  dueDate(o, c) {
    const s = U.parse(c.start);
    let y = s.getFullYear(), m = s.getMonth();
    if (o.dueDay < s.getDate()) m += 1;
    const dd = new Date(y, m, 1); y = dd.getFullYear(); m = dd.getMonth();
    return U.iso(new Date(y, m, Math.min(o.dueDay, U.dim(y, m))));
  },
  monthlyShare(o) { return o.kind === 'periodic' ? o.amount / (o.everyMonths || 12) : o.amount; },
  /* what this obligation reserves out of the cycle's income */
  reserved(o, key) {
    if (!Calc.active(o, key)) return 0;
    const h = o.history[key] || {};
    if (h.status === 'skipped') return 0;
    if (o.kind === 'variable') return h.actual != null ? h.actual : o.amount;
    return Calc.monthlyShare(o);
  },
  /* the amount actually paid out when the bill is due */
  payAmount(o, key) {
    const h = o.history[key] || {};
    if (o.kind === 'variable') return h.actual != null ? h.actual : o.amount;
    return o.amount;
  },
  collected(o, key) { // periodic: how much has been set aside by the end of this cycle
    const n = o.everyMonths || 12, left = Calc.keyDiff(key, Calc.dueKey(o, key));
    return Math.min(o.amount, Calc.monthlyShare(o) * (n - left));
  },
  status(o, c, today) {
    if (!Calc.active(o, c.key)) return 'stopped';
    const h = o.history[c.key] || {};
    if (h.status === 'skipped') return 'skipped';
    if (h.status === 'paid') return 'paid';
    if (!Calc.isDueCycle(o, c.key)) return 'saving';
    const due = Calc.dueDate(o, c), until = U.diffDays(today, due);
    if (o.kind === 'variable' && h.actual == null && until <= 0) return 'awaiting';
    if (until < 0) return 'late';
    if (until <= 3) return 'soon';
    return 'reserved';
  },
  avgActual(o, key, n = 3) {
    const vals = Object.keys(o.history).filter(k => k <= key && o.history[k].actual != null).sort().slice(-n).map(k => o.history[k].actual);
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  },

  /* ---- the cycle summary every screen reads from ---- */
  summary(c, d = Store.d, today = U.today()) {
    const st = d.settings;
    const extra = d.extra.filter(x => x.key === c.key).reduce((a, x) => a + x.amount, 0);
    const income = st.salary + extra;
    const obs = d.obligations.filter(o => Calc.active(o, c.key));
    const reservedOb = obs.reduce((a, o) => a + Calc.reserved(o, c.key), 0);
    const paidOb = obs.filter(o => (o.history[c.key] || {}).status === 'paid').reduce((a, o) => a + Calc.payAmount(o, c.key), 0);
    const savings = st.savings;
    const spendable = income - reservedOb - savings;
    const exps = d.expenses.filter(e => e.date >= c.start && e.date <= c.end);
    const spent = exps.reduce((a, e) => a + e.amount, 0);
    const isCurrent = today >= c.start && today <= c.end;
    const ref = isCurrent ? today : (today > c.end ? c.end : c.start);
    const spentToday = isCurrent ? exps.filter(e => e.date === today).reduce((a, e) => a + e.amount, 0) : 0;
    const remaining = spendable - spent;
    const floor = st.minBalance;
    const margin = remaining - floor;
    const dayIdx = U.diffDays(c.start, ref) + 1;
    const daysLeft = isCurrent ? U.diffDays(today, c.end) + 1 : 0;
    // safe daily = what can be spent per day (today included) and still finish the cycle at the floor
    const safeDaily = isCurrent ? Math.max(0, remaining + spentToday - floor) / daysLeft : 0;
    const todayLeft = safeDaily - spentToday;
    const plannedDaily = Math.max(0, spendable - floor) / c.days;
    const actualDaily = spent / Math.max(1, dayIdx);
    const pace = plannedDaily > 0 ? actualDaily / plannedDaily : null;
    let floorDate = null;
    if (isCurrent && actualDaily > 0 && margin > 0) floorDate = U.addDays(today, Math.floor(margin / actualDaily));
    const hitsFloor = isCurrent && floorDate && floorDate <= c.end;
    let status = 'ok';
    if (margin <= 0) status = 'critical';
    else if ((dayIdx >= 3 && pace > 1.1) || hitsFloor) status = 'warn';
    const byType = { need: 0, normal: 0, lux: 0 }, byCat = {};
    for (const e of exps) { byType[e.type] = (byType[e.type] || 0) + e.amount; byCat[e.category] = (byCat[e.category] || 0) + e.amount; }
    return { c, income, extra, salary: st.salary, reservedOb, paidOb, savings, spendable, spent, spentToday, remaining, floor, margin,
      dayIdx, daysLeft, safeDaily, todayLeft, plannedDaily, actualDaily, pace, floorDate, hitsFloor, status, byType, byCat, exps, isCurrent };
  },
  /* has this cycle got any activity at all (used for comparisons) */
  hasData(c, d = Store.d) { return d.expenses.some(e => e.date >= c.start && e.date <= c.end); },
};

const Store = {
  root: null,
  load() {
    try { this.root = JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { this.root = null; }
    if (!this.root || !this.root.users) this.root = { session: null, users: {}, theme: 'light' };
  },
  save() { try { localStorage.setItem(KEY, JSON.stringify(this.root)); } catch (e) { /* storage full or blocked: keep running in memory */ } },
  get acct() { const s = this.root.session; return s ? this.root.users[s] : null; },
  get d() { return this.acct && this.acct.data; },
  hash(pw) { let h = 5381; for (const c of pw) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return 'h' + (h >>> 0).toString(36); },

  /* --- auth (local mock: nothing leaves the device) --- */
  signup(name, email, pw) {
    email = email.trim().toLowerCase();
    if (this.root.users[email]) return 'exists';
    this.root.users[email] = { name: name.trim(), pw: this.hash(pw), data: blankData(name.trim(), email) };
    this.root.session = email; this.save(); return 'ok';
  },
  login(email, pw) {
    email = email.trim().toLowerCase();
    const u = this.root.users[email];
    if (!u || u.pw !== this.hash(pw)) return false;
    this.root.session = email; this.save(); return true;
  },
  loginDemo() {
    const email = 'ahmed@example.com';
    if (!this.root.users[email]) this.root.users[email] = { name: 'أحمد', pw: this.hash('Masarifak2026'), data: demoData() };
    this.root.session = email; this.save();
  },
  logout() { this.root.session = null; this.save(); },
  deleteAccount() { delete this.root.users[this.root.session]; this.root.session = null; this.save(); },
  changeEmail(newEmail) {
    const old = this.root.session; newEmail = newEmail.trim().toLowerCase();
    if (this.root.users[newEmail]) return false;
    // keep the old email active until the new one is confirmed (mock confirm)
    this.d.profile.pendingEmail = newEmail; this.save(); return true;
  },
  confirmPendingEmail() {
    const old = this.root.session, p = this.d.profile, ne = p.pendingEmail;
    if (!ne) return;
    this.root.users[ne] = this.root.users[old]; delete this.root.users[old];
    this.root.session = ne; p.email = ne; p.pendingEmail = null; p.verified = true; this.save();
  },
};

/* --- mutations on the signed-in account --- */
const Act = {
  addExpense(e) {
    const d = Store.d;
    const exp = Object.assign({ id: U.id(), createdAt: new Date().toISOString(), source: 'manual' }, e);
    d.expenses.unshift(exp); Store.save(); return exp;
  },
  updateExpense(id, patch) { const e = Store.d.expenses.find(x => x.id === id); Object.assign(e, patch); Store.save(); return e; },
  deleteExpense(id) { const d = Store.d; const i = d.expenses.findIndex(x => x.id === id); const [e] = d.expenses.splice(i, 1); Store.save(); return { e, i }; },
  restoreExpense({ e, i }) { Store.d.expenses.splice(i, 0, e); Store.save(); },
  rememberType(merchant, type) { Store.d.merchantTypes[merchant.trim()] = type; Store.save(); },
  saveObligation(o) {
    const d = Store.d;
    if (o.id) Object.assign(d.obligations.find(x => x.id === o.id), o);
    else d.obligations.push(Object.assign({ id: U.id(), history: {}, startKey: Calc.current().key, stopKey: null }, o));
    Store.save();
  },
  deleteObligation(id) { const d = Store.d; d.obligations = d.obligations.filter(o => o.id !== id); Store.save(); },
  setObStatus(id, key, rec) {
    const o = Store.d.obligations.find(x => x.id === id);
    if (rec == null) {
      const keep = o.history[key] && o.history[key].actual != null ? { actual: o.history[key].actual } : null;
      if (keep) o.history[key] = keep; else delete o.history[key];
    } else o.history[key] = Object.assign({}, o.history[key] || {}, rec);
    Store.save();
  },
  stopObligation(id, fromKey) { Store.d.obligations.find(x => x.id === id).stopKey = fromKey; Store.save(); },
  resumeObligation(id) { Store.d.obligations.find(x => x.id === id).stopKey = null; Store.save(); },
  setSettings(patch) { Object.assign(Store.d.settings, patch); Store.save(); },
};

  choices(name, opts, value, o = {}) {
    return `<div role="radiogroup" data-group="${name}" ${o.after ? `data-after="${o.after}"` : ''}>
      <input type="hidden" name="${name}" value="${U.esc(value ?? '')}">
      ${opts.map(([v, l, h, i]) => `<button type="button" class="choice" role="radio" aria-checked="${v === value}" data-act="pick" data-v="${v}">
        ${i ? `<span class="ricon">${ic(i)}</span>` : ''}<span style="flex:1"><span style="display:block;font-weight:600">${l}</span>${h ? `<span class="small muted">${h}</span>` : ''}</span><span class="radio"></span></button>`).join('')}</div>`;
  },
  switchRow(o) {
    return `<button type="button" class="row" role="switch" aria-checked="${!!o.on}" data-act="${o.act || 'toggle'}" ${Object.entries(o.data || {}).map(([k, v]) => `data-${k}="${v}"`).join(' ')}>
      ${o.icon ? `<span class="ricon">${ic(o.icon)}</span>` : ''}
      <span class="main"><span class="t" style="display:block;white-space:normal">${o.t}</span>${o.s ? `<span class="s" style="display:block;white-space:normal">${o.s}</span>` : ''}</span><span class="switch"></span></button>`;
  },
  empty(icon, title, text, btn = '') {
    return `<div class="empty"><div class="ricon acc">${ic(icon)}</div><h3>${title}</h3><p>${text}</p>${btn}</div>`;
  },
  note(kind, icon, html) { return `<div class="note ${kind}" role="${kind === 'crit' ? 'alert' : 'status'}">${ic(icon)}<div>${html}</div></div>`; },
  ferr(msg) { return `<div class="ferr" role="alert">${ic('alert')}${msg}</div>`; },
  skeleton() {
    return `<div aria-busy="true" aria-label="بيحمّل"><div class="skel" style="height:18px;width:40%;margin:12px 0"></div><div class="skel" style="height:48px;width:70%"></div>
      <div class="kpis"><div class="skel" style="height:76px"></div><div class="skel" style="height:76px"></div></div><div class="skel" style="height:90px;margin-top:16px"></div>
      <div class="skel" style="height:56px;margin-top:24px"></div><div class="skel" style="height:56px;margin-top:8px"></div></div>`;
  },
  expRow(e) {
    const cat = CATS[e.category] || CATS.other;
    const src = e.source === 'photo' ? ' · ' + ic('receipt', 'srcic') : '';
    return UI.row({ icon: cat.icon, iconCls: e.type === 'lux' ? 'warn' : '', t: U.esc(e.merchant), s: `${cat.label} · ${UI.typeTag(e.type)}`,
      end: `<span class="val">${U.m(e.amount)}</span>`, act: 'open-exp', data: { id: e.id }, aria: `${e.merchant} ${U.n(e.amount)} جنيه` });
  },
  pwStrength(pw) {
    let s = 0; if (pw.length >= 8) s++; if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) s++; if (/\d/.test(pw)) s++; if (/[^A-Za-z0-9]/.test(pw) || pw.length >= 14) s++;
    if (pw.length < 8) s = Math.min(s, 1);
    return { l: pw ? Math.max(1, s) : 0, text: !pw ? 'اكتب ٨ حروف على الأقل' : pw.length < 8 ? 'قصيرة · لازم ٨ حروف على الأقل' : ['', 'ضعيفة · ضيف أرقام أو حروف كبيرة', 'مقبولة', 'قوية', 'قوية جدًا'][Math.max(1, s)] };
  },
};

/* ===== app core: router, layers, events ===== */
const SCR = {}, SH = {}, ACT = {}, SUB = {}, INP = {};
const App = {
  stack: [], layer: null, toastT: null, scrolls: {}, lastFocus: null,
  get cur() { return this.stack[this.stack.length - 1]; },
  start() {
    Store.load(); applyTheme();
    if (!Store.acct) this.stack = [{ s: 'login', p: {} }];
    else if (!Store.d.onboarded) this.stack = [{ s: 'ob1', p: {} }];
    else this.stack = [{ s: 'home', p: { loading: true } }];
    this.render();
    if (this.cur.p.loading) setTimeout(() => { delete this.cur.p.loading; this.render(); }, 450);
  },
  keepScroll() { const b = document.querySelector('#view .body'); if (b && this.cur) this.scrolls[this.stack.length + this.cur.s] = b.scrollTop; },
  go(s, p = {}) { this.keepScroll(); this.layer = null; this.stack.push({ s, p }); this.render(true); },
  replace(s, p = {}) { this.layer = null; this.stack[this.stack.length - 1] = { s, p }; this.render(true); },
  reset(s, p = {}) { this.layer = null; this.stack = [{ s, p }]; this.scrolls = {}; this.render(true); },
  back() { if (this.layer) return this.close(); if (this.stack.length > 1) { this.stack.pop(); this.render(); } },
  render(fresh) {
    const { s, p } = this.cur, def = SCR[s];
    const view = document.getElementById('view');
    view.innerHTML = `<div class="scr" data-screen="${s}">${def.render(p)}</div>${def.tab ? UI.tabbar(def.tab) : ''}${def.fab ? def.fab(p) : ''}`;
    const b = view.querySelector('.body');
    if (b) b.scrollTop = fresh ? 0 : (this.scrolls[this.stack.length + s] || 0);
    if (def.mount) def.mount(p);
    this.renderLayer();
    if (fresh) { const h = view.querySelector('h1'); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } }
  },
  refresh() { this.keepScroll(); this.render(); },
  open(name, p = {}) { this.lastFocus = document.activeElement; this.layer = { name, p }; this.renderLayer(); const f = document.querySelector('#layer [autofocus], #layer input:not([type=hidden]), #layer button'); if (f) f.focus(); },
  close() { this.layer = null; this.renderLayer(); if (this.lastFocus && document.contains(this.lastFocus)) this.lastFocus.focus(); },
  renderLayer() {
    const el = document.getElementById('layer');
    if (!this.layer) { el.innerHTML = ''; return; }
    const def = SH[this.layer.name], html = def.render(this.layer.p);
    if (def.dialog) el.innerHTML = `<div class="scrim center" data-act="scrim"><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t">${html}</div></div>`;
    else el.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="grab"></div>${html}</div></div>`;
    if (def.mount) def.mount(this.layer.p);
  },
  toast(msg, undo) {
    const el = document.getElementById('toastl'); clearTimeout(this.toastT);
    const tabs = SCR[this.cur.s].tab;
    el.innerHTML = `<div class="toast ${tabs ? '' : 'notabs'}" role="status">${ic('ok')}<span class="main">${msg}</span>${undo ? '<button data-act="undo">تراجع</button>' : ''}</div>`;
    this._undo = undo; this.toastT = setTimeout(() => { el.innerHTML = ''; this._undo = null; }, undo ? 6000 : 3200);
  },
};
function sheetHead(title, o = {}) {
  return `<div class="shead">${o.lead || ''}<h2 id="sh-t">${title}</h2>${o.actions || ''}<button class="ibtn" data-act="close" aria-label="اقفل">${ic('close')}</button></div>`;
}
function applyTheme() { const t = Store.root.theme || 'light'; document.documentElement.dataset.theme = t === 'system' ? '' : t; if (t === 'system') delete document.documentElement.dataset.theme; }
function vals(form) { const o = {}; new FormData(form).forEach((v, k) => o[k] = v); return o; }
function setErr(form, name, msg) {
  const f = form.querySelector(`[data-field="${name}"]`); if (!f) return;
  f.querySelector('.input')?.classList.toggle('err', !!msg);
  f.querySelector('.ferr')?.remove();
  const inp = f.querySelector('input');
  if (msg) { f.insertAdjacentHTML('beforeend', UI.ferr(msg)); inp?.setAttribute('aria-invalid', 'true'); } else inp?.removeAttribute('aria-invalid');
}
function clearErrs(form) { form.querySelectorAll('.ferr').forEach(e => e.remove()); form.querySelectorAll('.input.err').forEach(e => e.classList.remove('err')); }

/* generic actions */
ACT.back = () => App.back();
ACT.close = () => App.close();
ACT.scrim = (el, ev) => { if (ev.target === el) App.close(); };
ACT.tab = el => App.reset(el.dataset.to);
ACT.go = el => App.go(el.dataset.to, Object.assign({}, el.dataset.id ? { id: el.dataset.id } : {}));
ACT.undo = () => { const u = App._undo; document.getElementById('toastl').innerHTML = ''; App._undo = null; if (u) u(); };
ACT.peek = el => {
  const inp = el.parentElement.querySelector('input'); const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password'; el.innerHTML = ic(show ? 'eyeoff' : 'eye'); el.setAttribute('aria-label', show ? 'اخفي كلمة السر' : 'اظهر كلمة السر');
};
ACT.pick = el => {
  const g = el.closest('[data-group]');
  g.querySelectorAll('[data-act="pick"]').forEach(b => b.setAttribute('aria-checked', String(b === el)));
  g.querySelector('input[type=hidden]').value = el.dataset.v;
  if (g.dataset.after && INP[g.dataset.after]) INP[g.dataset.after](el.dataset.v, g);
};
ACT.toggle = el => { el.setAttribute('aria-checked', String(el.getAttribute('aria-checked') !== 'true')); };
INP.strength = el => {
  const r = UI.pwStrength(el.value), f = el.closest('.field');
  f.querySelector('.strength').dataset.l = r.l; f.querySelector('[data-strength-text]').textContent = r.text;
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { if (el.tagName === 'A') ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('submit', ev => {
  const f = ev.target.closest('form[data-submit]'); if (!f) return; ev.preventDefault();
  SUB[f.dataset.submit](f, vals(f));
});
document.addEventListener('input', ev => { const el = ev.target.closest('[data-input]'); if (el && INP[el.dataset.input]) INP[el.dataset.input](el); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && App.layer) { ev.preventDefault(); App.close(); }
  if (ev.key === 'Tab' && App.layer) { // keep focus inside the open sheet/dialog
    const items = [...document.querySelectorAll('#layer button, #layer input:not([type=hidden]), #layer select, #layer textarea, #layer [tabindex]')].filter(x => !x.disabled);
    if (!items.length) return; const first = items[0], last = items[items.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }
});
document.addEventListener('change', ev => { const el = ev.target.closest('[data-change]'); if (el && INP[el.dataset.change]) INP[el.dataset.change](el); });

function paceNote(sm) {
  if (!sm.isCurrent) return '';
  if (sm.status === 'critical') return UI.note('crit', 'alert', `<b>المتبقي وصل للحد الأدنى.</b> اللي فاضل ليك ${U.m(sm.remaining)} وده ${sm.margin < 0 ? 'أقل من' : 'هو'} الحد (${U.m(sm.floor)}). خلّي الصرف للضروري بس لحد يوم القبض، وراجع لو فيه التزام ممكن يتأجل.`);
  if (!sm.spent) return UI.note('ok', 'ok', `لسه مفيش مصاريف متسجّلة الدورة دي. تقدر تصرف ${U.m0(sm.safeDaily)} في اليوم وتخلّص فوق الحد الأدنى.`);
  if (sm.dayIdx < 3) return UI.note('ok', 'ok', `لسه في أول الدورة. خطتك ${U.m0(sm.plannedDaily)} في اليوم.`);
  const lux = sm.byType.lux || 0;
  if (sm.status === 'warn') {
    let t = `<b>إنت بتصرف أسرع من خطتك شوية.</b> متوسطك ${U.m0(sm.actualDaily)} في اليوم والخطة ${U.m0(sm.plannedDaily)}.`;
    if (sm.hitsFloor) t += ` لو كمّلت بنفس المعدل هتوصل للحد الأدنى يوم ${U.dayMonth(sm.floorDate)}، قبل القبض بـ ${U.dayWord(U.diffDays(sm.floorDate, sm.c.next))}.`;
    if (lux > 0) t += ` لو قللت الرفاهيات (${U.m0(lux)} لحد دلوقتي) هتقدر تحافظ على الحد الأدنى.`;
    return `${UI.note('warn', 'clock', t)}`;
  }
  return UI.note('ok', 'ok', `ماشي على خطتك. متوسطك ${U.m0(sm.actualDaily)} في اليوم والخطة ${U.m0(sm.plannedDaily)}.`);
}
function cycleRuler(sm) {
  const c = sm.c, n = c.days, today = sm.dayIdx; const fIdx = sm.hitsFloor ? U.diffDays(c.start, sm.floorDate) + 1 : null;
  const over = sm.pace > 1.1;
  const ticks = Array.from({ length: n }, (_, i) => { const d = i + 1; let cls = d < today ? 'past' : d === today ? 'today' : '';
    if (fIdx && d === fIdx && d !== today) cls = 'floor'; return `<i class="${cls}"></i>`; }).join('');
  const total = Math.max(sm.spendable, 1), remPct = Math.max(0, Math.min(100, sm.remaining / total * 100)), floorPct = Math.min(100, sm.floor / total * 100);
  return `<section class="ruler" aria-label="الدورة والحد الأدنى">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px"><span>${ic('shield', '')} الحد الأدنى ${U.m0(sm.floor)}</span>
    <span class="${sm.margin <= 0 ? '' : 'muted'}">${sm.margin > 0 ? `فوقه بـ ${U.m0(sm.margin)}` : UI.tag('crit', 'alert', 'وصلت للحد')}</span></div>
    <div class="bar meter" role="img" aria-label="المتبقي ${U.n0(sm.remaining)} من ${U.n0(sm.spendable)}، والحد الأدنى ${U.n0(sm.floor)}" style="position:relative;margin:8px 0 16px">
      <i style="width:${remPct}%;background:${sm.status === 'critical' ? 'var(--crit)' : sm.status === 'warn' ? 'var(--warn)' : 'var(--acc)'}"></i>
      <span style="position:absolute;top:-3px;bottom:-3px;inset-inline-start:${floorPct}%;width:2px;background:var(--ink)"></span></div>
    <div class="ticks" role="img" aria-label="اليوم ${U.n0(today)} من ${U.n0(n)} في الدورة">${ticks}</div>
    <div class="ends"><span>${U.dayMonth(c.start)}</span><span>القبض ${U.dayMonth(c.next)}</span></div>
    <div class="legend"><span><b style="background:var(--acc)"></b>النهاردة · يوم ${U.n0(today)} من ${U.n0(n)}</span>
    ${fIdx ? `<span><b style="background:var(--warn)"></b>هتوصل للحد ${U.dayMonth(sm.floorDate)} بالمعدل ده</span>` : sm.isCurrent && sm.margin > 0 && sm.actualDaily > 0 ? `<span>${ic('check', '')} مش هتوصل للحد قبل القبض بالمعدل ده</span>` : ''}</div>
  </section>`;
}

function dueText(o, c) {
  const st = Calc.status(o, c, U.today()); const due = Calc.dueDate(o, c); const k = U.diffDays(U.today(), due);
  if (st === 'saving') return `بيتدفع ${U.monthYear(Calc.cycleByKey(Calc.dueKey(o, c.key), Store.d.settings.payday).start)}`;
  if (st === 'awaiting') return 'كان مستحق ' + U.dayMonth(due) + ' · دخّل الفاتورة';
  if (k < 0) return `كان مستحق ${U.dayMonth(due)}`;
  if (k === 0) return 'مستحق النهاردة';
  if (k === 1) return 'مستحق بكرة';
  return `مستحق ${U.dayMonth(due)} · بعد ${U.dayWord(k)}`;
}
/* "٥٠ كشري" quick entry — the same parser the Ask tab uses */
function parseQuick(s) {
  const m = String(s).trim().match(/^([\d٠-٩.,٫٬]+)\s*(?:ج(?:نيه)?\.?م?)?\s+(.+)$/) || String(s).trim().match(/^(.+?)\s+([\d٠-٩.,٫٬]+)\s*(?:ج(?:نيه)?\.?م?)?$/);
  if (!m) return null; let a = U.num(m[1]), t = m[2]; if (isNaN(a)) { a = U.num(m[2]); t = m[1]; }
  if (!(a > 0)) return null; return { amount: a, merchant: t.trim() };
}
function guessFor(merchant) {
  const d = Store.d, k = merchant.trim(); const prev = d.expenses.find(e => e.merchant === k);

}

function cycleChoices() {

function filterExps(f = App.f) {

  let list = Store.d.expenses.filter(e => (!cyc || (e.date >= cyc.start && e.date <= cyc.end)) && (!q || U.norm(e.merchant + ' ' + CATS[e.category].label + ' ' + (e.note || '')).includes(q))
    && (!f.cats.length || f.cats.includes(e.category)) && (!f.types.length || f.types.includes(e.type)) && (isNaN(mn) || e.amount >= mn) && (isNaN(mx) || e.amount <= mx));
  return f.sort === 'amount' ? list.sort((a, b) => b.amount - a.amount) : list.sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));

function compareData() {
  const pd = Store.d.settings.payday, cur = Calc.current(), prev = Calc.cycleByKey(Calc.shiftKey(cur.key, -1), pd);
  if (!Calc.hasData(prev)) return null;
  // compare like with like: same number of days into each cycle
  const upto = Math.min(U.diffDays(cur.start, U.today()) + 1, prev.days);
  const pick = (c) => { const end = U.addDays(c.start, upto - 1); const ex = Store.d.expenses.filter(e => e.date >= c.start && e.date <= end);
    const r = { total: 0, type: { need: 0, normal: 0, lux: 0 }, cat: {} }; ex.forEach(e => { r.total += e.amount; r.type[e.type] += e.amount; r.cat[e.category] = (r.cat[e.category] || 0) + e.amount; }); return r; };
  const a = pick(cur), b = pick(prev);
  let top = null; for (const k of Object.keys(TYPES)) { const dlt = a.type[k] - b.type[k]; if (dlt > 0 && (!top || dlt > top.d)) top = { d: dlt, label: TYPES[k].label, a: a.type[k], b: b.type[k] }; }
  return { cur, prev, upto, a, b, top };
}

SCR.export = { render: () => { const d = Store.d; return `${UI.top('صدّر بياناتي')}<div class="body">
  <p class="lead">نسخة من كل بياناتك تفتحها في Excel أو تحتفظ بيها.</p>
  <div class="group">${UI.row({ icon: 'list', t: 'المصاريف · CSV', s: `${U.n0(d.expenses.length)} مصروف · بيفتح في Excel و Google Sheets`, act: 'export', data: { f: 'csv' } })}
  ${UI.row({ icon: 'download', t: 'كل البيانات · JSON', s: 'المصاريف والالتزامات والإعدادات', act: 'export', data: { f: 'json' } })}</div>
  <div id="exp-out" style="margin-top:16px"></div></div>`; } };
function csvOf() {
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  return '\uFEFF' + ['التاريخ,المكان,الفئة,النوع,المبلغ,المصدر', ...Store.d.expenses.slice().sort((a, b) => a.date.localeCompare(b.date)).map(e => [e.date, q(e.merchant), CATS[e.category].label, TYPES[e.type].label, e.amount, e.source].join(','))].join('\n');
}
ACT.export = async el => {
  const isCsv = el.dataset.f === 'csv', data = isCsv ? csvOf() : JSON.stringify(Object.assign({}, Store.d, { chat: undefined, expenses: Store.d.expenses.map(e => Object.assign({}, e, { receipt: e.receipt ? '[صورة]' : null })) }), null, 2);
  const filename = `masarifak-${U.today()}.${isCsv ? 'csv' : 'json'}`, out = document.getElementById('exp-out');
  let dl = null; try { dl = window.claude && await window.claude.use('downloads'); } catch (e) { dl = null; }
  if (dl) { try { await dl.save({ filename, data }); App.toast('اتحفظ الملف'); return; } catch (e) { if (e && e.code === 'declined') return App.toast('اتلغى الحفظ'); } }
  // fallback where saving files isn't available: show it to copy
  out.innerHTML = `${UI.note('', 'info', 'الحفظ كملف مش متاح هنا. انسخ المحتوى والصقه في ملف.')}<div class="input" style="margin-top:10px"><textarea readonly aria-label="محتوى الملف" style="min-height:180px;font-size:12px;direction:ltr">${U.esc(data)}</textarea></div><button class="btn sec" style="margin-top:10px" data-act="copy-exp">انسخ</button>`;
};
ACT['copy-exp'] = async () => { const t = document.querySelector('#exp-out textarea'); try { await navigator.clipboard.writeText(t.value); App.toast('اتنسخ'); } catch (e) { t.select(); App.toast('اتحدد النص · انسخه'); } };

/* delete account */
SCR.delete = { render: () => `${UI.top('احذف الحساب')}<div class="body">
  ${UI.note('crit', 'alert', '<b>الحذف نهائي.</b> كل مصاريفك والتزاماتك وإعداداتك هتتمسح ومش هتقدر ترجعها.')}
  <p class="small" style="margin:14px 2px">لو عايز نسخة الأول <button class="link" data-act="go" data-to="export">صدّر بياناتك</button>.</p>
  <form data-submit="delete" novalidate>${UI.field({ name: 'pw', label: 'اكتب كلمة السر للتأكيد', type: 'password', dir: 'ltr', ac: 'current-password' })}
  <button class="btn danger">احذف حسابي</button></form></div>` };
SUB.delete = (f, v) => { clearErrs(f); if (Store.acct.pw !== Store.hash(v.pw)) return setErr(f, 'pw', 'كلمة السر مش مظبوطة');
  App.open('confirm', { title: 'متأكد؟', text: 'آخر خطوة. الحساب وكل بياناته هيتمسحوا من الجهاز ده.', ok: 'احذف نهائيًا', danger: true, run: () => { Store.deleteAccount(); App.reset('login'); App.toast('اتحذف الحساب'); } }); };

/* scale the phone frame to fit the browser window (desktop/tablet preview only) */
(function () {
  const d = document.getElementById('device');
  const f = () => { if (getComputedStyle(d).display !== 'block') { d.style.transform = ''; return; }
    const k = Math.min(1, (innerHeight - 32) / 876, (innerWidth - 32) / 417); d.style.transform = k < 1 ? `scale(${k})` : ''; };
  f(); addEventListener('resize', f);
})();

App.start();
</script>

<script>
/* ===================================================================
   V2 — the parts of the spec the prototype was missing.

   Added here rather than edited into the screens above, so the original
   code stays the single source for everything it already covered:

     §8.11  المدخرات والأهداف      SCR.savings · SCR.pocket · SH.goalForm · SH.withdraw
     §8.12  مراجعة قفل الدورة      SCR.review
     §8.16  صندوق الإشعارات        SCR.inbox
     §8.26  التقييم والاقتراحات    SH.feedback
     §8.7   الجرس · كارت المراجعة · كارت المدخرات على الرئيسية
     §8.22  شيل «حد يومي» — مفيش له API

   =================================================================== */

/* ---------- 1. the new state, and a migration for accounts already saved ---------- */
const V2 = {
  /* every account in localStorage predates these fields */
  migrate(d) {
    if (!d) return;
    if (!d.pockets) {
      const monthly = d.settings.savings || 0;
      d.pockets = {
        general: { id: 'gen', name: 'الادخار العام', balance: 0, contribution: monthly, txs: [] },
        goals: [],
      };
    }
    if (!d.notifs) d.notifs = [];
    if (!d.reviews) d.reviews = {};
    if (!d.feedback) d.feedback = { sent: [], lastAsk: null };
  },
};

/* ---------- 2. §8.11 pockets: the money model ---------- */
const Pockets = {
  all() { const p = Store.d.pockets; return [p.general, ...p.goals]; },
  find(id) { return this.all().find(x => x.id === id); },
  total() { return this.all().reduce((a, x) => a + x.balance, 0); },
  monthly() { return this.all().reduce((a, x) => a + (x.contribution || 0), 0); },

  /* §6.2 reads one number for savings, so keep it equal to the sum of the
     pockets' contributions — otherwise the home figure and this screen drift. */
  sync() { Store.d.settings.savings = this.monthly(); Store.save(); },

  tx(pocket, type, amount, note) {
    pocket.txs.unshift({ id: U.id(), type, amount, key: Calc.current().key, note: note || '', at: U.today() });
    pocket.balance += amount;
  },

  /* §8.11: the row title comes from the tx type — the app never maps the enum */
  txLabel(t) {
    return { deposit: 'إيداع شهري', opening: 'رصيد افتتاحي', surplus: `فائض من دورة`,
      withdraw: 'سحب للمتاح', cover: 'تغطية عجز', transfer_in: 'نقل من هدف', transfer_out: 'نقل للادخار' }[t.type] || t.type;
  },

  /* cycles between now and the goal's target month */
  cyclesLeft(g) { return Math.max(1, Calc.keyDiff(Calc.current().key, g.targetKey)); },
  /* §6.3: (target − balance) ÷ cycles left, floored like every other division */
  suggest(g) { return Math.max(0, Math.floor((g.target - g.balance) / this.cyclesLeft(g))); },
  pct(g) { return g.target > 0 ? Math.min(100, Math.floor(g.balance * 100 / g.target)) : 0; },
  /* where the goal lands if the contribution never changes */
  projected(g) { return g.balance + (g.contribution || 0) * this.cyclesLeft(g); },
};

SCR.savings = {
  render() {
    const p = Store.d.pockets, g = p.general;
    return `${UI.top('المدخرات')}<div class="body">
      <section class="hero" aria-label="إجمالي المدخرات">
        <div class="lbl">إجمالي اللي حوّشته</div>
        <div class="amt"><bdi>${U.n0(Pockets.total())}</bdi><span class="cur"> ج.م</span></div>
        <div class="sub">بتحجز ${U.m0(Pockets.monthly())} كل دورة</div>
      </section>
      <p class="small muted" style="margin-top:10px">الرصيد ده من اللي سجّلته في التطبيق، مش حساب بنك متربوط.</p>

      <h2 class="h2">الادخار العام</h2>
      <div class="group">${UI.row({ icon: 'piggy', iconCls: 'acc', t: U.m0(g.balance),
        s: g.contribution ? `بيزيد ${U.n0(g.contribution)} كل دورة` : 'مفيش إيداع شهري',
        act: 'open-pocket', data: { id: 'gen' }, chev: true })}</div>

      <h2 class="h2">أهدافي ${p.goals.length ? `<button class="link" data-act="new-goal">هدف جديد</button>` : ''}</h2>
      ${p.goals.length ? `<div class="group">${p.goals.map(x => {
        const pct = Pockets.pct(x), left = Pockets.cyclesLeft(x);
        return `<button class="row has-ic" data-act="open-pocket" data-id="${x.id}">
          <span class="ricon ${x.achievedAt ? 'acc' : ''}">${ic(x.achievedAt ? 'check' : 'wave')}</span>
          <span class="main"><span class="t" style="display:block">${U.esc(x.name)}</span>
            <span class="s" style="display:block">${U.n0(x.balance)} من ${U.n0(x.target)} · ${U.pct(pct)}</span>
            <span class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></span>
            <span class="s" style="display:block;margin-top:4px">${x.achievedAt ? 'اكتمل' : `${U.n0(x.contribution || 0)} كل دورة · فاضل ${left} دورة`}</span>
          </span>${ic('chev', 'chev')}</button>`; }).join('')}</div>`
      : `<div class="group">${UI.empty('wave', 'مفيش أهداف لسه',
          'الهدف بيحجز مبلغ كل دورة لحد ما توصل للمبلغ اللي عايزه.',
          `<button class="btn pri" data-act="new-goal">${ic('plus')}هدف جديد</button>`)}</div>`}
    </div>`;
  } };

ACT['open-savings'] = () => App.go('savings');
ACT['open-pocket'] = el => App.go('pocket', { id: el.dataset.id });
ACT['new-goal'] = () => App.open('goalForm', {});

SCR.pocket = {
  render(p) {
    const k = Pockets.find(p.id);
    if (!k) return `${UI.top('المدخرات')}<div class="body">${UI.empty('alert', 'مش لاقيين الحصّالة دي', '')}</div>`;
    const isGoal = k.id !== 'gen', pct = isGoal ? Pockets.pct(k) : 0;
    const under = isGoal && !k.achievedAt && (k.contribution || 0) < Pockets.suggest(k);
    return `${UI.top(U.esc(k.name), { actions: isGoal ? `<button class="ibtn" data-act="edit-goal" data-id="${k.id}" aria-label="عدّل الهدف">${ic('pen')}</button>` : '' })}
      <div class="body">
      <section class="hero" aria-label="رصيد الحصّالة">
        <div class="lbl">الرصيد</div>
        <div class="amt"><bdi>${U.n0(k.balance)}</bdi><span class="cur"> ج.م</span></div>
        ${isGoal ? `<div class="sub">من ${U.m0(k.target)} · ${pct}٪ · الهدف ${U.monthYear(Calc.cycleByKey(k.targetKey, Store.d.settings.payday).start)}</div>` : ''}
      </section>
      ${isGoal ? `<span class="bar" style="margin:12px 0 4px"><i style="width:${pct}%"></i></span>` : ''}

      <div class="group" style="margin-top:12px">
        ${UI.row({ icon: 'repeat', t: `بيتحجز ${U.m0(k.contribution || 0)} كل دورة`,
          s: isGoal ? (k.mode === 'fixed' ? 'مبلغ ثابت إنت كاتبه' : 'السيرفر بيحسبه عشان توصل في الميعاد') : 'من إعدادات الفلوس',
          end: isGoal ? `<button class="btn sec sm" data-act="edit-goal" data-id="${k.id}">عدّل</button>` : `<button class="btn sec sm" data-act="go" data-to="money">عدّل</button>` })}
      </div>
      ${under ? UI.note('warn', 'info', `بالقسط ده هتوصل لـ ${U.m0(Pockets.projected(k))} بس في ${U.monthYear(Calc.cycleByKey(k.targetKey, Store.d.settings.payday).start)}. المقترح ${U.m0(Pockets.suggest(k))} كل دورة.`) : ''}

      <div class="qa">
        <button class="btn pri" data-act="withdraw" data-id="${k.id}" ${k.balance <= 0 ? 'disabled' : ''}>${ic('download')}اسحب</button>
        ${isGoal ? `<button class="btn sec" data-act="del-goal" data-id="${k.id}">${ic('trash')}امسح الهدف</button>` : ''}
      </div>

      <h2 class="h2">الحركات</h2>
      ${k.txs.length ? `<div class="group">${k.txs.map(t => UI.row({
        icon: t.amount >= 0 ? 'plus' : 'download', iconCls: t.amount >= 0 ? 'acc' : '',
        t: Pockets.txLabel(t) + (t.type === 'surplus' || t.type === 'cover' ? ` ${t.key}` : ''),
        s: `${U.relDay ? U.relDay(t.at) : t.at}${t.note ? ' · ' + U.esc(t.note) : ''}`,
        end: `<span class="val" style="color:${t.amount >= 0 ? 'var(--acc-text)' : 'var(--ink)'}">${t.amount >= 0 ? '+' : '−'}${U.n0(Math.abs(t.amount))}</span>` })).join('')}</div>`
      : `<div class="group">${UI.empty('receipt', 'مفيش حركات', 'الإيداعات والسحب هيظهروا هنا.')}</div>`}
    </div>`;
  } };

/* ---- the goal sheet (§8.11) ---- */
ACT['edit-goal'] = el => App.open('goalForm', { id: el.dataset.id });
SH.goalForm = {
  render(p) {
    const g = p.id ? Pockets.find(p.id) : null;
    const months = Array.from({ length: 24 }, (_, i) => {
      const key = Calc.shiftKey(Calc.current().key, i + 1);
      return [key, U.monthYear(Calc.cycleByKey(key, Store.d.settings.payday).start)];
    });
    const target = g ? g.targetKey : months[5][0];
    return `${sheetHead(g ? 'عدّل الهدف' : 'هدف جديد')}<div class="sbody">
      <form data-submit="goal" id="goalf" novalidate>
        <input type="hidden" name="id" value="${g ? g.id : ''}">
        ${UI.field({ name: 'name', label: 'الهدف إيه؟', value: g ? g.name : '', placeholder: 'عربية', attrs: g ? '' : 'autofocus' })}
        ${UI.money({ name: 'target', label: 'عايز توصل لكام؟', value: g ? g.target : '', big: true })}
        <div class="field"><label class="flabel">تحب توصل امتى؟</label>
          ${UI.pick('targetKey', months, target, { scroll: true, label: 'شهر الهدف', after: 'goalCalc' })}</div>
        ${g ? '' : UI.money({ name: 'opening', label: 'معاك منه كام دلوقتي؟', value: '', hint: 'فلوس موجودة فعلًا — مش إيداع شهري.' })}
        ${UI.money({ name: 'contribution', label: 'تحجز كام كل دورة؟', value: g && g.mode === 'fixed' ? g.contribution : '',
          placeholder: 'سيبها فاضية والسيرفر يحسبها', hint: '<span data-goal-hint>المقترح بيتحسب من المبلغ والميعاد.</span>' })}
      </form></div>
      <div class="sfoot"><button class="btn pri" form="goalf">${g ? 'احفظ' : 'اعمل الهدف'}</button></div>`;
  },
  mount() { V2.goalHint(); } };
INP.goalCalc = () => V2.goalHint();
V2.goalHint = function () {
  const f = document.getElementById('goalf'); if (!f) return;
  const el = f.querySelector('[data-goal-hint]'); if (!el) return;
  const target = U.num(f.target.value), key = f.targetKey.value;
  const opening = f.opening ? U.num(f.opening.value) : (Pockets.find(f.id.value) || {}).balance || 0;
  const left = Math.max(1, Calc.keyDiff(Calc.current().key, key));
  if (!(target > 0)) { el.textContent = 'اكتب المبلغ الأول.'; return; }
  const per = Math.max(0, Math.floor((target - opening) / left));
  el.innerHTML = `المقترح <b>${U.n0(per)} ج.م</b> كل دورة على ${left} دورة.` +
    (per > Store.d.settings.salary * 0.2 ? ` <span style="color:var(--warn)">ده أكتر من ٢٠٪ من مرتبك.</span>` : '');
};
SUB.goal = (f, v) => {
  clearErrs(f);
  const name = (v.name || '').trim(), target = U.num(v.target), key = v.targetKey;
  if (!name) return setErr(f, 'name', 'اكتب اسم الهدف');
  if (!(target > 0)) return setErr(f, 'target', 'اكتب مبلغ أكبر من صفر');
  const p = Store.d.pockets;
  const typed = (v.contribution || '').trim() !== '';
  const contribution = typed ? U.num(v.contribution) : null;
  if (v.id) {
    const g = Pockets.find(v.id);
    Object.assign(g, { name, target, targetKey: key, mode: typed ? 'fixed' : 'auto' });
    g.contribution = typed ? contribution : Pockets.suggest(g);
  } else {
    const opening = U.num(v.opening);
    const g = { id: U.id(), name, target, targetKey: key, balance: 0, contribution: 0, mode: typed ? 'fixed' : 'auto', txs: [], achievedAt: null };
    if (opening > 0) Pockets.tx(g, 'opening', opening);
    g.contribution = typed ? contribution : Pockets.suggest(g);
    p.goals.push(g);
  }
  Pockets.sync(); App.close(); App.refresh();
  /* §8.11: the contribution starts NEXT cycle — this cycle's spendable was
     already computed and the user has been spending against it. */
  App.toast(v.id ? 'اتحفظ' : `اتعمل الهدف · هيتحجز من الدورة الجاية`);
};

/* ---- withdraw (§8.11) ---- */
ACT['withdraw'] = el => App.open('withdraw', { id: el.dataset.id });
SH.withdraw = {
  render(p) {
    const k = Pockets.find(p.id), sm = Calc.summary(Calc.current());
    return `${sheetHead(`تسحب كام من «${U.esc(k.name)}»؟`)}<div class="sbody">
      <form data-submit="wd" id="wdf" novalidate>
        <input type="hidden" name="id" value="${k.id}">
        ${UI.money({ name: 'amt', label: 'المبلغ', value: '', big: true, attrs: 'autofocus', hint: `الرصيد ${U.m0(k.balance)}` })}
        ${UI.field({ name: 'note', label: 'ملاحظة (اختياري)', value: '', placeholder: 'طوارئ' })}
        ${UI.note('', 'info', `المتبقي ليك الدورة دي هيزيد: ${U.m0(sm.remaining)} ← <b>${U.m0(sm.remaining)}</b> + اللي هتسحبه.`)}
      </form></div>
      <div class="sfoot"><button class="btn pri" form="wdf">اسحب</button></div>`;
  } };
SUB.wd = (f, v) => {
  clearErrs(f);
  const k = Pockets.find(v.id), a = U.num(v.amt);
  if (!(a > 0)) return setErr(f, 'amt', 'اكتب مبلغ أكبر من صفر');
  if (a > k.balance) return setErr(f, 'amt', `الرصيد ${U.n0(k.balance)} بس`);
  Pockets.tx(k, 'withdraw', -a, v.note);
  /* §8.11: a withdrawal is INCOME in the current cycle — not a negative
     expense, so it never reaches the category totals or the report. */
  Store.d.extra.push({ id: U.id(), key: Calc.current().key, amount: a, note: `سحب من ${k.name}` });
  if (k.id !== 'gen' && k.mode === 'auto') k.contribution = Pockets.suggest(k);
  Pockets.sync(); App.close(); App.refresh();
  App.toast(`اتسحب ${U.n0(a)} · المتبقي زاد ${U.n0(a)}`);
};

/* ---- delete a goal (§8.11): the balance has to go somewhere ---- */
ACT['del-goal'] = el => {
  const k = Pockets.find(el.dataset.id);
  /* §8.11: an ordinary confirmation at zero, and the «تنقلهم فين؟» sheet
     once the goal holds money. */
  if (k.balance <= 0) {
    return App.open('confirm', { title: 'تمسح الهدف؟', text: 'مفيش رصيد فيه.', ok: 'امسح', danger: true,
      run: () => V2.removeGoal(k.id, 'none') });
  }
  App.open('goalDel', { id: k.id });
};
SH.goalDel = {
  render(p) {
    const k = Pockets.find(p.id);
    return `${sheetHead('تمسح الهدف؟')}<div class="sbody">
      <p>الهدف ده فيه <b>${U.m0(k.balance)}</b>. تنقلهم فين؟</p>
      <form data-submit="goalDel" id="gdf" novalidate>
        <input type="hidden" name="id" value="${k.id}">
        ${UI.choices('to', [
          ['general', 'للادخار العام', 'يفضلوا محوّشين', 'piggy'],
          ['spendable', 'للمتاح للصرف الدورة دي', 'يزيدوا المتبقي ليك', 'wallet'],
        ], 'general')}
      </form></div>
      <div class="sfoot"><button class="btn pri" form="gdf">امسح الهدف</button></div>`;
  } };
SUB.goalDel = (f, v) => { V2.removeGoal(v.id, v.to); };
ACT['del-goal-go'] = el => { V2.removeGoal(el.dataset.id, 'none'); };
V2.removeGoal = function (id, to) {
  const p = Store.d.pockets, k = Pockets.find(id), bal = k.balance;
  if (bal > 0 && to === 'general') Pockets.tx(p.general, 'transfer_in', bal, `من هدف ${k.name}`);
  if (bal > 0 && to === 'spendable') Store.d.extra.push({ id: U.id(), key: Calc.current().key, amount: bal, note: `من هدف ${k.name}` });
  p.goals = p.goals.filter(x => x.id !== id);
  Pockets.sync(); App.close();
  if (App.cur.s === 'pocket') App.back(); else App.refresh();
  App.toast('اتمسح الهدف');
};

/* ---------- 3. §8.12 closing a cycle ---------- */
V2.pending = function () {
  const d = Store.d; if (!d || !d.onboarded) return null;
  const cur = Calc.current(), prev = Calc.cycleOf(U.addDays(cur.start, -1), d.settings.payday);
  if (d.reviews[prev.key]) return null;
  if (!Calc.hasData(prev, d) && !d.obligations.some(o => Calc.active(o, prev.key))) return null;
  return prev;
};
V2.unpaid = function (c) {
  return Store.d.obligations.filter(o => Calc.active(o, c.key) && Calc.isDueCycle(o, c.key))
    .map(o => ({ o, h: o.history[c.key] || {} }))
    .filter(x => x.h.status !== 'paid' && x.h.status !== 'skipped');
};

SCR.review = {
  render(p) {

INP.reviewCalc = () => {
  const f = document.getElementById('revf'); if (!f) return;
  const picks = {};
  f.querySelectorAll('[data-group^="ob_"]').forEach(g => { picks[g.dataset.group.slice(3)] = g.querySelector('input').value; });
  App.cur.p.picks = picks; App.refresh();
};
SUB.review = (f, v) => {
  const d = Store.d, key = v.key, c = Calc.cycleByKey(key, d.settings.payday);
  const sm = Calc.summary(c), un = V2.unpaid(c);
  let end = sm.remaining;
  for (const { o } of un) {
    const pick = v['ob_' + o.id] || 'carry';
    if (pick === 'paid') o.history[key] = Object.assign({}, o.history[key], { status: 'paid', on: c.end });
    else if (pick === 'cancel') { o.history[key] = Object.assign({}, o.history[key], { status: 'skipped' }); end += Calc.reserved(o, key); }
    /* 'carry' leaves it unpaid — the server turns it into arrears on the new cycle */
  }
  const res = v.res || 'carry';
  if (end > 0 && res === 'savings') Pockets.tx(d.pockets.general, 'surplus', end, `فائض ${key}`);
  if (end < 0 && res === 'pocket') {
    const take = Math.min(-end, d.pockets.general.balance);
    if (take > 0) Pockets.tx(d.pockets.general, 'cover', -take, `عجز ${key}`);
  }
  if (end < 0 && res === 'debt') {
    const n = Math.max(2, Math.min(12, parseInt(v.inst, 10) || 3));
    const per = Math.ceil(-end / n);                       /* §6.7 uses ceil here */
    d.obligations.push({ id: U.id(), name: `عجز دورة ${Calc.shortLabel(c)}`, kind: 'fixed', amount: per,
      dueDay: d.settings.payday, category: 'other', history: {},
      startKey: Calc.current().key, stopKey: Calc.shiftKey(Calc.current().key, n) });
  }
  d.reviews[key] = { at: U.today(), res, end };
  Pockets.sync(); Store.save();
  App.reset('home');
  App.toast(`اتقفلت دورة ${Calc.shortLabel(c)}`);
};

V2.ago = function (iso) {
  const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (mins < 1) return 'دلوقتي';
  if (mins < 60) return `قبل ${mins} دقيقة`;
  const h = Math.round(mins / 60); if (h < 24) return `قبل ${h} ساعة`;
  const dd = Math.round(h / 24); return dd === 1 ? 'إمبارح' : `قبل ${dd} يوم`;
};

  if (d.pockets.seeded) return;
  d.pockets.seeded = true;
  const g = d.pockets.general;
  if (!g.txs.length) {

  if (!d.pockets.goals.length) {
    const car = { id: U.id(), name: 'عربية', target: 50000, targetKey: Calc.shiftKey(Calc.current().key, 8),
      balance: 0, contribution: 400, mode: 'fixed', txs: [], achievedAt: null };
    Pockets.tx(car, 'opening', 18000);

  }
  if (!d.notifs.length) {
    const sm = Calc.summary(Calc.current());
    Notifs.add('cycle_review', 'الدورة خلصت', 'راجع دورتك اللي خلصت وقرّر تعمل إيه باللي فضل.', { s: 'review', p: {} });

  Pockets.sync();
};

/* كل الشاشات اللي في المواصفات بقت موجودة */
const API_MISSING = [];

/* ───────── the panel ───────── */
const ApiDoc = {
  on: false,
  esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); },
  /* the examples carry <i> and <b> on purpose, so bring just those two back */
  code(s) { return this.esc(s).replace(/&lt;(\/?[ib])&gt;/g, '<$1>'); },

  ep(e) {
    const flags = (e.flags || []).map(f =>
      f === 'idem' ? '<span class="ad-flag idem">🔁 Idempotency-Key</span>'
      : f === 'dry_run' ? '<span class="ad-flag">?dry_run=1</span>'
      : `<span class="ad-flag">flag: ${this.esc(f)}</span>`).join('');
    return `<div class="ad-ep">
      <div class="ad-sig"><span class="ad-m ${e.m}">${e.m}</span><span class="ad-p">${this.esc(e.p)}</span>${flags}</div>
      ${e.when ? `<p class="ad-when">${e.when}</p>` : ''}
      ${e.body ? `<p class="ad-lbl">Request</p><pre>${this.code(e.body)}</pre>` : ''}
      ${e.res ? `<p class="ad-lbl">Response</p><pre>${this.code(e.res)}</pre>` : ''}
      ${e.keys ? `<p class="ad-lbl">المفاتيح</p><table class="ad-keys">${
        e.keys.map(([k, v]) => `<tr><td>${this.esc(k)}</td><td dir="rtl">${v}</td></tr>`).join('')}</table>` : ''}
    </div>`;
  },

  missing() {
    if (!API_MISSING.length) {
      return `<p class="ad-note" dir="rtl" style="margin-top:14px">كل شاشات §8 الموجودة في المواصفات اتغطّت — ٢٦ شاشة و١٢ شيت، كلها موثّقة.</p>`;
    }
    return `<p class="ad-lbl">في المواصفات ومش في البروتوتايب</p>
      <table class="ad-keys">${API_MISSING.map(([s, t, e]) =>
        `<tr><td>${s}</td><td dir="rtl">${t}<br><span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);direction:ltr;display:inline-block">${this.esc(e)}</span></td></tr>`).join('')}</table>`;
  },

  sync() {
    const key = (App.layer && App.layer.name) || (App.cur && App.cur.s) || '';
    const d = API_DOC[key];
    const sec = document.getElementById('ad-sec'), k = document.getElementById('ad-key'),
          ar = document.getElementById('ad-ar'), body = document.getElementById('ad-body');
    if (!sec) return;
    k.textContent = key;
    sec.textContent = d ? d.sec : '—';
    ar.textContent = d ? d.ar : '';
    if (!d) { body.innerHTML = `<p class="ad-none">مفيش توثيق للشاشة دي.</p>` + this.missing(); return; }
    body.innerHTML =
      (d.gap ? `<p class="ad-note ad-gap" dir="rtl"><b>فرق بين التصميم والـAPI.</b> ${d.gap}</p>` : '') +
      (d.note ? `<p class="ad-note" dir="rtl">${d.note}</p>` : '') +
      (d.eps.length
        ? `<p class="ad-lbl">Headers · على كل ريكوست</p><pre>${this.code(HDRS)}</pre>` + d.eps.map(e => this.ep(e)).join('')
        : (d.gap || d.note ? '' : `<p class="ad-none">الشاشة دي مش بتبعت أي ريكوست.</p>`))
      + (key === 'home' ? this.missing() : '');
    body.scrollTop = 0;
  },

  toggle() {
    this.on = !this.on;
    document.getElementById('apidoc').classList.toggle('open', this.on);
    document.getElementById('apidoc-btn').setAttribute('aria-pressed', String(this.on));
    if (this.on) this.sync();
  },
};

/* keep the panel on whatever screen or sheet is showing */
(function () {
  const r = App.render.bind(App), l = App.renderLayer.bind(App);
  App.render = function (f) { r(f); ApiDoc.sync(); };
  App.renderLayer = function () { l(); ApiDoc.sync(); };
  document.addEventListener('click', e => {
    if (e.target.closest('[data-apidoc-toggle]')) { e.preventDefault(); ApiDoc.toggle(); }
    else if (e.target.closest('[data-apidoc-close]')) { e.preventDefault(); if (ApiDoc.on) ApiDoc.toggle(); }
  });
  ApiDoc.sync();
})();
</script>
